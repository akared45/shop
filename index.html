<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Architecture - Structure & UML Diagrams</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header>
        <div class="container">
            <h1>Clean Architecture Structure</h1>
            <p>Chi tiết nhiệm vụ từng folder và file cùng với UML Diagrams</p>
        </div>
    </header>

    <div class="container">
        <nav class="navbar">
            <button class="nav-btn active" data-target="structure">
                <span>📁</span> Structure Project
            </button>
            <button class="nav-btn" data-target="uml">
                <span>📊</span> UML Diagrams
            </button>
        </nav>

        <div id="structure" class="content-section active">
            <div id="layers" class="layers-container">
                <div class="loading">Đang tải dữ liệu...</div>
            </div>
        </div>

        <div id="uml" class="content-section">
            <div class="uml-tabs">
                <div class="uml-tab active" data-tab="activity">Activity Diagrams</div>
                <div class="uml-tab" data-tab="sequence">Sequence Diagrams</div>
                <div class="uml-tab" data-tab="class">Class Diagrams</div>
                <div class="uml-tab" data-tab="component">Component Diagrams</div>
                <div class="uml-tab" data-tab="component">Use case</div>
            </div>

            <div id="uml-content-container">
                <div class="loading">Đang tải UML diagrams...</div>
            </div>
        </div>
    </div>
    <div id="lightbox" class="lightbox">
        <div class="lightbox-controls">
            <button class="lightbox-btn" id="zoom-in" title="Phóng to">➕</button>
            <button class="lightbox-btn" id="zoom-out" title="Thu nhỏ">➖</button>
            <button class="lightbox-btn" id="reset-zoom" title="Đặt lại">🔄</button>
            <button class="lightbox-btn close-btn" id="close-lightbox" title="Đóng">×</button>
        </div>
        <img id="lightbox-img" src="" alt="Zoomed diagram">
        <div class="zoom-indicator" id="zoom-indicator">100%</div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
